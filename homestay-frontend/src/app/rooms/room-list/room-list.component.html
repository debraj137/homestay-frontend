<!-- responsive -->
 <div class="bg-gray-100 min-h-screen p-4 sm:p-6">
  <!-- Header section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-6 gap-4">
    <h2 class="text-xl sm:text-2xl font-bold">Rooms Listed By Owner</h2>
    <button
      class="w-full sm:w-auto bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-md transition text-sm"
      routerLink="add-room">
      Add Room
    </button>
  </div>

  <!-- Room cards grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (room of rooms; track $index) {
      <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col">
        <img [src]="room.images[0]" alt="room" class="w-full h-48 object-cover" />

        <div class="p-4 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="text-lg font-semibold">{{ room.title }}</h3>
            <p class="text-sm text-gray-500">{{ room.location.addressLine1 }}</p>
            <div class="flex justify-between items-center mt-2">
              <span class="text-red-500 font-bold text-lg">₹{{ room.price }}/night</span>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="flex flex-col sm:flex-row gap-2 mt-4">
            <button
              class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-md transition text-sm"
              (click)="updateRoom(room._id!)">
              Update Room
            </button>

            @if (room.isApproved) {
              <button
                class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-md transition text-sm">
                Approved
              </button>
            }
            @else {
              <button
                class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-md transition text-sm">
                Pending
              </button>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>
