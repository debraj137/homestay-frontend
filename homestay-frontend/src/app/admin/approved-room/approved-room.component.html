<div class="bg-gray-100 min-h-screen p-6">
    <h2 class="text-2xl font-bold mb-6">Rooms Listed By Owner</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        @for (room of rooms; track $index) {
        <!-- Room Card -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col">
            <img [src]="room.images[0]" alt="room" class="w-full h-48 object-cover">
            <!-- <h6 class="text-sm">{{room._id}}</h6> -->
            <div class="p-4 flex-1 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-semibold">{{room.title}}</h3>
                    <p class="text-sm text-gray-500">{{room.location.addressLine1}}</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-red-500 font-bold text-lg">₹{{room.price}}/night</span>
                        <!-- <span class="text-yellow-500 font-semibold">⭐ 4.3333</span> -->
                                     <div class="mt-4">
                <!-- <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category:</label> -->
                <select class="w-full border rounded px-3 py-2" [(ngModel)]="room.category"
                    (change)="updateCategory(room._id!, room.category)">
                    <option value="Normal">Normal</option>
                    <option value="Silver">Silver</option>
                    <option value="Gold">Gold</option>
                    <option value="Diamond">Diamond</option>
                </select>
            </div>
                    </div>
                </div>
            </div>
        </div>
        }
    </div>
</div>
