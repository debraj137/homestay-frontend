<div class="bg-gray-100 min-h-screen p-6">
    <!-- <div class="flex justify-between py-8"> -->
        <h2 class="text-2xl font-bold mb-6">Rooms Listed By Owner</h2>
        <!-- <button class="w-1/12 bg-green-500 hover:bg-green-600 text-white py-2 rounded-md transition text-sm"
        routerLink="add-room">
            Add Room
        </button> -->
    <!-- </div> -->

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        @for (room of rooms; track $index) {
            
           
        <!-- Room Card -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col">
            <img [src]="room.images[0]" alt="room" class="w-full h-48 object-cover">
             <!-- <h6 class="text-sm">{{room._id}}</h6> -->
            <div class="p-4 flex-1 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-semibold">{{room.title}}</h3>
                    <p class="text-sm text-gray-500">{{room.location.addressLine1}}</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-red-500 font-bold text-lg">₹{{room.price}}/night</span>
                        <span class="text-yellow-500 font-semibold">⭐ 4.3</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-2 mt-4">
                    <button class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-md transition text-sm"
                    (click)="approveRoom(room._id)">
                        Approve
                    </button>

                    <button
                        class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-md transition text-sm">
                        Reject
                    </button>

                </div>
            </div>
        </div>
        }
    </div>

</div>
