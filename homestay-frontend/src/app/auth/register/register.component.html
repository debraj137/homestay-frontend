<!-- responsive -->
 <div class="relative bg-[url('bed.jpg')] bg-cover bg-center min-h-screen flex items-center justify-center">
  <!-- Overlay to enhance readability -->
  <div class="absolute inset-0 bg-black bg-opacity-50"></div>

  <div class="relative w-full max-w-7xl mx-auto px-4 py-12 flex flex-col lg:flex-row items-center justify-center z-10 gap-10">
    
    <!-- Left: Text Section -->
    <div class="text-white font-bold flex-1 text-center lg:text-left">
      <h3 class="text-3xl md:text-5xl mb-4">There’s a smarter way to OYO around</h3>
      <p class="text-sm md:text-base max-w-md mx-auto lg:mx-0">
        Sign up with your phone number and get exclusive access to discounts and savings on OYO stays and with
        our many travel partners.
      </p>
    </div>

    <!-- Right: Form Section -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 md:p-8">
      <h2 class="text-2xl font-bold text-gray-800 text-center mb-4">Create Your Account</h2>

      <form class="space-y-4" [formGroup]="registrationForm">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input type="text" placeholder="Your name" formControlName="name"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" placeholder="you@example.com" formControlName="email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
          <input type="text" placeholder="Enter mobile number" formControlName="mobileNumber"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" placeholder="••••••••" formControlName="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" />
        </div>

        <div>
          <button type="submit" (click)="register()" [disabled]="registrationForm.invalid"
            class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-lg transition duration-300">
            Register
          </button>
        </div>
      </form>

      <p class="text-sm text-gray-500 text-center mt-4">
        Already have an account?
        <a routerLink="/auth/login" class="text-red-500 hover:underline">Login</a>
      </p>
    </div>
  </div>
</div>
