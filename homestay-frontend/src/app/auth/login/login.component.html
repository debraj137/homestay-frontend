<!-- responsive -->
<div class="relative bg-[url('bed.jpg')] bg-cover bg-center min-h-screen flex items-center justify-center">
  
  <!-- Overlay for darkening image -->
  <div class="absolute inset-0 bg-black bg-opacity-50"></div>

  <div class="relative flex flex-col md:flex-row w-full max-w-6xl mx-auto z-10">
    
    <!-- Left Section -->
    <div class="text-white font-bold p-6 md:p-16 flex-1 flex flex-col justify-center items-center text-center md:text-left">
      <h3 class="text-3xl md:text-5xl mb-4">There’s a smarter way to STAY around</h3>
      <p class="text-sm md:text-base max-w-md">
        Sign up with your phone number and get exclusive access to discounts and savings on stays and with our many travel partners.
      </p>
    </div>

    <!-- Login Section -->
    <div class="w-full md:w-[500px] flex items-center justify-center p-6">
      <div class="w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        <h2 class="text-2xl font-bold text-gray-800 text-center">Login With Your Account</h2>

        <form class="space-y-4" [formGroup]="loginForm">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" placeholder="you@example.com" formControlName="email"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" placeholder="••••••••" formControlName="password"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" />
          </div>

          <div>
            <button type="submit" (click)="login()"
              class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-lg transition duration-300">
              Login
            </button>
          </div>
        </form>

        <p class="text-sm text-gray-500 text-center">Don't have an account?
          <a class="text-red-500 hover:underline" routerLink="/auth/register">Register Now</a>
        </p>
      </div>
    </div>

  </div>
</div>
